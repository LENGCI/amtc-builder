name: Build amtc for ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      ssh_debug:
        description: '是否开启 SSH 调试(一般不需要了,仅作最后手段保留)'
        required: false
        default: 'false'
        type: boolean

env:
  IMMORTALWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  IMMORTALWRT_BRANCH: openwrt-25.12
  TARGET: x86
  SUBTARGET: 64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库(存放自定义 Makefile)
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget xxd perl pandoc

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --branch $IMMORTALWRT_BRANCH --depth 1 $IMMORTALWRT_REPO immortalwrt

      - name: 缓存工具链与下载包(重点:控制体积,避免重复编译)
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/dl
            immortalwrt/staging_dir/host
            immortalwrt/staging_dir/toolchain-*
            immortalwrt/build_dir/host*
            immortalwrt/build_dir/toolchain-*
          key: immortalwrt-toolchain-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('**/.config') }}
          restore-keys: |
            immortalwrt-toolchain-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: 更新 feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入 amtc 的 package Makefile
        run: |
          mkdir -p immortalwrt/package/network/utils/amtc
          cat > immortalwrt/package/network/utils/amtc/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=amtc
          PKG_VERSION:=0.8.5
          PKG_RELEASE:=1

          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/schnoddelbotz/amtc.git
          PKG_SOURCE_VERSION:=master
          PKG_SOURCE_SUBDIR:=$(PKG_NAME)-$(PKG_VERSION)
          PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz
          PKG_MIRROR_HASH:=skip

          PKG_MAINTAINER:=you@example.com
          PKG_LICENSE:=GPL-2.0

          PKG_BUILD_PARALLEL:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/amtc
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Intel AMT/vPro mass remote power management tool
            DEPENDS:=+libcurl +libgnutls +libpthread
          endef

          define Package/amtc/description
            Lightweight CLI tool for Intel AMT/vPro out-of-band power management.
          endef

          AMTC_HEADERS:=amtc_usage cmd_powerdown cmd_powerup cmd_info cmd_powerreset \
          	cmd_powercycle wsman_info wsman_info_step2 wsman_up wsman_down \
          	wsman_reset wsman_xenum wsman_xenum_step2 wsman_pxeboot wsman_hddboot wsman_bootconfig \
          	wsman_solredir_enable wsman_solredir_disable \
          	wsman_webui_enable wsman_webui_disable \
          	wsman_ping_enable wsman_ping_disable \
          	wsman_shutdown_graceful wsman_reset_graceful

          define Build/Compile
          	export PATH="$$$$PATH:/usr/bin:/bin"; \
          	cd $(PKG_BUILD_DIR)/src; \
          	rm -rf amtterm; \
          	git clone --depth 1 https://github.com/kraxel/amtterm.git amtterm; \
          	sed -e '1,/\* ----/d' -e '/static void usage/,1000d' amtterm/amtterm.c > amtc-amtterm.c; \
          	AMTCV=`cat ../version`; \
          	cp amtc_usage amtc_usage.bak; \
          	perl -pi -e "s/#AMTCV#/$$$$AMTCV/" amtc_usage; \
          	for H in $(AMTC_HEADERS); do \
          		xxd -i "$$$$H" "$$$$H.h"; \
          	done; \
          	mv amtc_usage.bak amtc_usage; \
          	cat amtc_usage.h cmd_*.h wsman_*.h wsman.h > amt.h; \
          	perl -pi -e 's/(0x\S\S)$$$$/$$$$1, 0x00/' amt.h; \
          	perl -pi -e 's/(\d+);$$$$/$$$$1 + 1 .";"/e' amt.h; \
          	$(TARGET_CC) $(TARGET_CFLAGS) -I. -I$(STAGING_DIR)/usr/include \
          		-DWITH_GPL_AMTTERM \
          		amtterm/tcp.c amtterm/redir.c amtc-amtterm.c amtc.c \
          		$(TARGET_LDFLAGS) -L$(STAGING_DIR)/usr/lib -lcurl -lpthread \
          		-o amtc
          endef

          define Package/amtc/install
          	$(INSTALL_DIR) $(1)/usr/sbin
          	$(INSTALL_BIN) $(PKG_BUILD_DIR)/src/amtc $(1)/usr/sbin/amtc
          endef

          $(eval $(call BuildPackage,amtc))
          EOF

      - name: 生成最小 defconfig(x86/64 + amtc)
        working-directory: immortalwrt
        run: |
          make defconfig
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          echo "CONFIG_PACKAGE_amtc=m" >> .config
          make defconfig

      - name: 下载依赖源码包
        working-directory: immortalwrt
        run: make download -j8 V=s

      - name: 构建 host 工具链(sed/tar/patch 等)
        working-directory: immortalwrt
        run: make tools/install -j$(nproc) V=s

      - name: 构建交叉编译工具链(gcc/binutils 等)
        working-directory: immortalwrt
        run: make toolchain/install -j$(nproc) V=s

      - name: SSH 调试(默认关闭,仅万一失败时手动开启)
        if: ${{ github.event.inputs.ssh_debug == 'true' }}
        uses: lhotari/action-upterm@v1
        timeout-minutes: 180
        with:
          limit-access-to-actor: true

      - name: 编译 amtc 包
        working-directory: immortalwrt
        run: make package/amtc/compile V=s -j1

      - name: 查找生成的 ipk
        run: find immortalwrt/bin/ -name "amtc*.ipk"

      - name: 上传 ipk 产物
        uses: actions/upload-artifact@v4
        with:
          name: amtc-ipk
          path: immortalwrt/bin/**/amtc*.ipk
